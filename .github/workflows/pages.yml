name: Publish V2 to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed build
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify map preservation and perspective behavior
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
